<footer class="footer" id="footer">
  <div class="container">
    <div class="row">
      <!-- Copyright and Logo Section -->
      <div class="col-md-4">
        <p><a href="{{ site.baseurl }}/legal/" class="footer-links">Privacy Policy</a></p>
        <a href="{{ site.baseurl }}/tech/"><img src="{{ site.baseurl }}/assets/img/clients/logo.png" alt="Company Logo" width="30">
        </a>
        </div>

      <!-- Privacy Policy and Creative Commons -->
      <div class="col-md-4 text-center">
        <p><a href="{{ site.baseurl }}/fb/" class="footer-links">Facebook Free Social Media Statement</a></p>
        <a href="https://network.creativecommons.org/">
          <img src="{{ site.baseurl }}/assets/img/icons/cc.png" alt="Creative Commons Logo" height="31"/>
        </a>
        <p><a href="{{ site.baseurl }}/commit-tree.txt" class="footer-links">{{ site.version }}</a></p>
      </div>

      <!-- Total Size of Site and Render Time -->
      <div class="col-md-4 text-right">
        <p>
        <a href="{{ site.baseurl }}/open-jobs" class="footer-links">Open Jobs</a>
        </p>
        <p id="footer-render-time">Render Time: Loading...</p>
      </div>
    </div>
  </div>
</footer>

<script>
  (function () {
    function updateRenderTime() {
      var renderTimeEl = document.getElementById('footer-render-time');
      if (!renderTimeEl) return;

      var timeMs;
      var navEntries = performance.getEntriesByType('navigation');

      if (navEntries.length > 0) {
        timeMs = navEntries[0].loadEventEnd;
      } else if (performance.timing) {
        var t = performance.timing;
        timeMs = t.loadEventEnd - t.navigationStart;
      }

      if (timeMs && timeMs > 0) {
        renderTimeEl.textContent = 'Render Time: ' + (timeMs / 1000).toFixed(2) + 's';
      } else {
        renderTimeEl.textContent = 'Render Time: N/A';
      }
    }

    function handleLoad() {
      // loadEventEnd isn't populated until after load listeners finish,
      // so defer the read to the next tick
      setTimeout(updateRenderTime, 0);
    }

    if (document.readyState === 'complete') {
      setTimeout(updateRenderTime, 0);
    } else {
      window.addEventListener('load', handleLoad);
    }
  })();
</script>
